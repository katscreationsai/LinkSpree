<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scumthirst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&amp;family=Baloo+2:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --hot:#ff2e93;
  --deep:#d1137a;
  --darker:#b80f6a;
  --pink:#ff7ac6;
  --bubble:#ffc2e2;
  --blush:#fff0f8;
  --ink:#6e0c45;
  --aqua:#7ff3ff;
  --gold:#ffe36b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--pink)}
body{
  margin:0;
  min-height:100vh;
  font-family:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  font-weight:500;
  color:var(--ink);
  line-height:1.45;
  overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* background: bubblegum gradient, gingham weave, twinkling glitter */
.bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#ff8ccf 0%,#ffb3dc 45%,#ffd6ec 100%);
}
.bg::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 22px,transparent 22px 44px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 22px,transparent 22px 44px);
}
.bg::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(2.5px 2.5px at 20px 30px,#fff,transparent),
    radial-gradient(2px 2px at 70px 95px,#fff,transparent),
    radial-gradient(2px 2px at 115px 55px,var(--gold),transparent),
    radial-gradient(2.5px 2.5px at 155px 125px,#fff,transparent),
    radial-gradient(2px 2px at 40px 140px,var(--aqua),transparent);
  background-size:180px 170px;
  animation:twinkle 2.6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}

.float-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fl{
  position:absolute;bottom:-60px;
  will-change:transform,opacity;
  animation-name:rise;
  animation-timing-function:linear;
  animation-fill-mode:forwards;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.7));
}
@keyframes rise{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  8%{opacity:.95}
  50%{transform:translate(var(--dx),-58vh) rotate(calc(var(--rot) * .5))}
  90%{opacity:.95}
  100%{transform:translate(calc(var(--dx) * -.6),-118vh) rotate(var(--rot));opacity:0}
}
.spark{position:fixed;inset:0;z-index:50;pointer-events:none}

/* viewport container */
.wrap{
  position:relative;z-index:2;
  max-width:480px;
  margin:0 auto;
  padding:16px 12px calc(96px + env(safe-area-inset-bottom));
}

/* the window */
.win{
  background:var(--blush);
  border:4px solid #fff;
  border-radius:20px;
  box-shadow:0 0 0 3px var(--hot),8px 8px 0 3px var(--deep);
  overflow:hidden;
}
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;
  background:linear-gradient(180deg,#ff9bd5 0%,var(--hot) 52%,#e0147f 100%);
  border-bottom:3px solid #fff;
  color:#fff;
}
.bar-title{
  font-family:Pacifico,"Brush Script MT",cursive;
  font-size:19px;
  text-shadow:0 2px 0 var(--darker);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
.dots i:nth-child(1){background:var(--aqua)}
.dots i:nth-child(2){background:var(--gold)}
.dots i:nth-child(3){background:#fff}

.marq{
  overflow:hidden;white-space:nowrap;
  background:#fff;
  border-bottom:3px dotted var(--hot);
  padding:5px 0;
  font-weight:800;font-size:15px;color:var(--deep);
}
.marq-in{display:inline-block;animation:scroll 22s linear infinite;padding-left:0}
.marq-in span{padding-right:44px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.body{padding:22px 16px 24px}

.me{text-align:center;margin-bottom:24px}
.av{
  width:112px;height:112px;border-radius:50%;
  margin:0 auto 16px;
  border:5px solid #fff;
  box-shadow:0 0 0 4px var(--hot),6px 6px 0 4px var(--deep);
  overflow:hidden;background:var(--bubble);
  display:flex;align-items:center;justify-content:center;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:62%;height:62%;display:block}
.nm{
  margin:0 0 8px;
  font-family:Pacifico,"Brush Script MT",cursive;
  font-weight:400;
  font-size:clamp(28px,9vw,38px);
  line-height:1.2;
  color:var(--hot);
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,4px 4px 0 var(--bubble);
  overflow-wrap:anywhere;
}
.bio{margin:0 auto;max-width:34ch;font-size:17px;font-weight:700;overflow-wrap:anywhere}

/* link buttons */
.links{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.lnk{
  display:flex;align-items:center;gap:12px;
  min-height:58px;padding:8px 18px 8px 10px;
  border-radius:999px;
  border:3px solid #fff;
  background:linear-gradient(180deg,#fff 0%,#ffd7ec 46%,#ffa6d6 54%,var(--pink) 100%);
  box-shadow:0 0 0 2px var(--deep),0 5px 0 2px var(--darker);
  color:var(--ink);
  text-decoration:none;
  font-weight:800;font-size:18px;
  transition:transform .08s,box-shadow .08s;
}
.lnk:hover{transform:translateY(-2px) rotate(-.6deg)}
.lnk:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--deep),0 1px 0 2px var(--darker)}
.lnk:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:4px solid var(--aqua);outline-offset:3px}
.ic{
  flex:none;width:40px;height:40px;border-radius:50%;
  background:#fff;border:2px solid var(--hot);
  display:flex;align-items:center;justify-content:center;
  font-size:21px;color:var(--hot);
  line-height:1;
  padding:0;
  text-align:center;
}
.lt{flex:1;min-width:0;text-align:center;overflow-wrap:anywhere;padding-right:40px}

.empty{
  text-align:center;padding:18px;border:3px dashed var(--hot);border-radius:16px;
  background:#fff;font-weight:700;
}

/* framed extras gallery */
.gal-frame{
  margin-top:22px;
  background:#fff;
  border:3px solid var(--hot);
  border-radius:18px;
  padding:14px;
  box-shadow:0 0 0 2px var(--bubble),0 4px 0 var(--deep);
}
.gal{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:12px;
}
.gal-item{
  border:3px solid var(--hot);border-radius:14px;overflow:hidden;background:var(--blush);
  display:flex;flex-direction:column;
}
.gal-item img{width:100%;height:88px;object-fit:cover;display:block;background:#fce4f0}
.gal-item .cap{padding:4px 6px;font-size:12px;font-weight:700;overflow-wrap:anywhere;background:#fff}
.gal-item .msg{padding:8px;font-size:13px;font-weight:600;overflow-wrap:anywhere;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center}
.gal-item .ctl{display:flex;gap:4px;padding:4px;background:#fff;border-top:2px dotted var(--hot)}
.gal-item .ctl button{flex:1;padding:2px 0;font-size:11px;border-radius:6px;border:2px solid var(--hot);background:var(--blush);font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink)}
.gal-item .ctl button:active{background:var(--bubble)}
.msgtext{white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;width:100%}

/* visitor count */
.count{
  margin:30px 0 0;text-align:center;font-weight:700;font-size:14px;
}
.count-label{
  display:block;margin-bottom:6px;font-size:13px;font-weight:800;color:var(--deep);
  letter-spacing:.04em;text-transform:uppercase;
}
.digits{display:inline-flex;gap:3px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.dg{
  display:inline-block;min-width:22px;padding:2px 4px;
  background:#2a0518;color:#ff7ac6;border:2px solid #fff;border-radius:4px;
  font-family:"Courier New",monospace;font-weight:700;font-size:20px;
  box-shadow:0 0 0 1px var(--deep);
}

/* editor */
.sec{
  margin-top:24px;padding:16px;
  background:#fff;border:3px solid var(--hot);border-radius:16px;
}
.sec h2{
  margin:0 0 12px;
  font-family:Pacifico,"Brush Script MT",cursive;font-weight:400;
  font-size:22px;color:var(--hot);
}
.sec h3{margin:18px 0 8px;font-size:16px;font-weight:800;color:var(--deep)}
label.f{display:block;margin:0 0 12px;font-weight:800;font-size:15px}
label.f span{display:block;margin-bottom:4px}
input[type=text],input[type=url],textarea{
  width:100%;font:inherit;font-size:16px;font-weight:500;color:var(--ink);
  padding:10px 12px;background:var(--blush);
  border:3px solid var(--hot);border-radius:12px;
}
textarea{resize:vertical;min-height:70px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;padding:6px 18px;
  font:inherit;font-weight:800;font-size:16px;color:var(--ink);
  background:linear-gradient(180deg,#fff,#ffc2e2);
  border:3px solid var(--hot);border-radius:999px;
  box-shadow:0 4px 0 var(--deep);
  cursor:pointer;text-decoration:none;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.main{background:linear-gradient(180deg,#ff9bd5,var(--hot));color:#fff;text-shadow:0 1px 0 var(--darker)}
.btn.danger{border-color:#7a0f2a;color:#7a0f2a;box-shadow:0 4px 0 #7a0f2a}
.btn.sm{min-height:38px;padding:2px 12px;font-size:14px;box-shadow:0 3px 0 var(--deep)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pk{
  width:42px;height:42px;font-size:20px;
  border:2px solid var(--hot);border-radius:50%;background:#fff;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.pk:active{background:var(--bubble)}
.err{color:#a0123a;font-weight:800;margin:0 0 10px;min-height:1.2em}
.hint{font-size:14px;margin:6px 0 0;font-weight:500}

.lrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px;border:3px solid var(--hot);border-radius:16px;background:var(--blush);
}
.lrow .meta{flex:1;min-width:140px}
.lrow .meta b{display:block;overflow-wrap:anywhere}
.lrow .meta small{display:block;font-size:13px;overflow-wrap:anywhere;opacity:.85}
.lctl{display:flex;gap:6px;flex-wrap:wrap}

.toggle{
  position:fixed;z-index:60;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
}
.toast{
  position:fixed;z-index:70;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;border:3px solid #fff;border-radius:999px;
  padding:8px 18px;font-weight:800;max-width:90vw;text-align:center;
  transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .bg::after,.marq-in{animation:none}
  .fl{display:none}
  .lnk,.btn{transition:none}
}
@media (min-width:640px){
  .wrap{padding-top:40px}
}

/* patch tab / media gallery styles */
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tab-btn{
  flex:1;min-width:80px;padding:6px 10px;border-radius:999px;border:3px solid var(--hot);
  background:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.tab-btn.on{background:linear-gradient(180deg,#ff9bd5,var(--hot));color:#fff;text-shadow:0 1px 0 var(--darker);border-color:var(--deep)}

.patch-tab .sec{margin-top:14px}
.audio-info{font-size:13px;font-weight:700;color:var(--deep);margin:6px 0 0}
.audio-ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
audio{display:none}
</style>

  if(window.Intl && Intl.Segmenter){
    return Array.from(new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(s),function(x){return x.segment;});
  }
  return Array.from(s);
}
function normalizeUrl(raw){
  var u=(raw||"").trim();
  if(!u) return null;
  if(/\s/.test(u)) return null;
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(u)) u="https://"+u;
  var parsed;
  try{ parsed=new URL(u); }catch(e){ return null; }
  var ok=["http:","https:","mailto:","tel:"];
  if(ok.indexOf(parsed.protocol)===-1) return null;
  if((parsed.protocol==="http:"||parsed.protocol==="https:") && parsed.hostname.indexOf(".")===-1 && parsed.hostname!=="localhost") return null;
  return parsed.href;
}

function defaults(){

      name:"Kat's Creations AI",

      avatar:"",
      emojis:DEFAULT_EMOJI.join(" ")
    },
    links:[],
    taps:0,
    gallery:[],
    audio:{
      enabled:false,
      mode:"loop",
      tracks:[]
    }

}

function sanitize(raw){
  var out=defaults();
  if(!raw || typeof raw!=="object") return out;
  var p=raw.profile||{};
  ["name","bio","marquee","emojis"].forEach(function(k){
    if(typeof p[k]==="string") out.profile[k]=p[k].slice(0,k==="bio"?240:120);
  });
  if(typeof p.avatar==="string" && /^data:image\/(jpeg|png|webp);base64,/.test(p.avatar) && p.avatar.length<400000) out.profile.avatar=p.avatar;
  out.links=[];
  (Array.isArray(raw.links)?raw.links:[]).slice(0,100).forEach(function(l){
    if(!l||typeof l.name!=="string") return;
    var href=normalizeUrl(l.href||l.url);
    var name=l.name.trim().slice(0,60);
    if(!href||!name) return;
    out.links.push({
      id:(typeof l.id==="string"&&l.id)?l.id.slice(0,30):uid(),
      name:name,
      href:href,
      emoji:firstGlyph(typeof l.emoji==="string"?l.emoji:""),
      clicks:Math.max(0,parseInt(l.clicks,10)||0)
    });
  });
  out.taps=Math.max(0,parseInt(raw.taps,10)||0);

  out.gallery=[];
  (Array.isArray(raw.gallery)?raw.gallery:[]).slice(0,50).forEach(function(g){
    if(!g||typeof g!=="object") return;
    var type = g.type==="text" ? "text" : "image";
    var item={ id: (typeof g.id==="string"&&g.id)?g.id.slice(0,30):uid(), type:type, caption:(typeof g.caption==="string"?g.caption.slice(0,120):"") };
    if(type==="image"){
      if(typeof g.data==="string" && /^data:image\/(jpeg|png|webp);base64,/.test(g.data) && g.data.length<600000) item.data=g.data;
      else return;
    } else {
      if(typeof g.text==="string") item.text=g.text.slice(0,500);
      else return;
    }
    out.gallery.push(item);
  });

  out.audio = { enabled:false, mode:"loop", tracks:[] };
  var a = raw.audio;
  if(a && typeof a==="object"){
    out.audio.enabled = !!a.enabled;
    out.audio.mode = (a.mode==="shuffle") ? "shuffle" : "loop";
    (Array.isArray(a.tracks)?a.tracks:[]).slice(0,10).forEach(function(t){
      if(!t||typeof t!=="object") return;
      if(typeof t.data==="string" && /^data:audio\/mpeg;base64,/.test(t.data) && t.data.length<2500000){
        out.audio.tracks.push({ id:(typeof t.id==="string"&&t.id)?t.id.slice(0,30):uid(), name:(typeof t.name==="string"?t.name.slice(0,60):"track"), data:t.data });
      }
    });
    if(!out.audio.tracks.length) out.audio.enabled=false;
  }
  return out;
}

/* ---------- background audio manager ---------- */
var audioEl=null;
var currentTrackIndex=-1;
var audioContextStarted=false;
var pendingAudioStart=false;

function initAudio(){
  if(audioEl) return;
  audioEl=new Audio();
  audioEl.style.display="none";
  audioEl.setAttribute("data-dyn","");
  document.body.appendChild(audioEl);
  audioEl.loop = (S.audio.mode==="loop");
  audioEl.addEventListener("ended", function(){
    if(S.audio.mode==="shuffle" && S.audio.enabled){
      playNextTrack();
    } else if(S.audio.mode==="loop" && S.audio.enabled){
      audioEl.play().catch(function(){});
    }
  });
}

function playTrack(index){
  if(!S.audio.enabled || !S.audio.tracks.length) return;
  if(index<0 || index>=S.audio.tracks.length) index=0;
  currentTrackIndex=index;
  var track=S.audio.tracks[index];
  initAudio();
  audioEl.src=track.data;
  audioEl.loop = (S.audio.mode==="loop");
  audioEl.play().catch(function(){
    pendingAudioStart=true;
  });
  audioContextStarted=true;
}

function playNextTrack(){
  if(!S.audio.tracks.length) return;
  if(S.audio.mode==="shuffle"){
    if(S.audio.tracks.length===1){ playTrack(0); return; }
    var next;
    do { next=Math.floor(Math.random()*S.audio.tracks.length); } while(next===currentTrackIndex);
    playTrack(next);
  } else {
    playTrack(0);
  }
}

function stopAudio(){
  if(audioEl){ audioEl.pause(); audioEl.src=""; }
  currentTrackIndex=-1;
  audioContextStarted=false;
}

function syncAudioState(){
  if(S.audio.enabled && S.audio.tracks.length){
    if(!audioContextStarted || !audioEl || audioEl.paused){
      playTrack(currentTrackIndex>=0?currentTrackIndex:0);
    }
  } else {
    stopAudio();
  }
}

function resumeAudioOnGesture(){
  if(pendingAudioStart && S.audio.enabled){
    pendingAudioStart=false;
    syncAudioState();
  }
}

app.addEventListener("click",function(e){
  resumeAudioOnGesture();

  var a=e.target.closest("a.lnk");
  if(a && !PUB){
    var l=S.links.filter(function(x){return x.id===a.getAttribute("data-id");})[0];
    if(l){l.clicks++;S.taps++;save();}
    return;
  }
  var b=e.target.closest("[data-act]");
  if(!b) return;
  var act=b.getAttribute("data-act"), id=b.getAttribute("data-id");
  var i=S.links.findIndex(function(x){return x.id===id;});
  if(act==="toggle"){editing=!editing;editId=null;editTab="links";render();window.scrollTo(0,0);}
  else if(act==="tab-links"){editTab="links";render();}
  else if(act==="tab-extras"){editTab="extras";render();}
  else if(act==="up" && i>0){var t=S.links[i];S.links[i]=S.links[i-1];S.links[i-1]=t;save();render();}
  else if(act==="down" && i>-1 && i<S.links.length-1){var t2=S.links[i];S.links[i]=S.links[i+1];S.links[i+1]=t2;save();render();}
  else if(act==="edit"){editId=id;editTab="links";render();var lf=document.getElementById("lf");if(lf)lf.scrollIntoView({behavior:"smooth",block:"center"});}
  else if(act==="cancel"){editId=null;render();}
  else if(act==="del"){
    if(i>-1 && confirm('delete "'+S.links[i].name+'"?')){S.links.splice(i,1);if(editId===id)editId=null;save();render();toast("link deleted");}
  }
  else if(act==="pick"){
    var lemo=document.getElementById("lemo");
    if(lemo) lemo.value=b.getAttribute("data-e");
  }
  else if(act==="rmav"){S.profile.avatar="";save();render();}
  else if(act==="export"){
    download(slug()+"-backup.json",JSON.stringify(S,null,2),"application/json");
    toast("backup downloaded");
  }
  else if(act==="publish"){
    download("index.html",buildStandalone(),"text/html");
    toast("standalone page downloaded");
  }
  else if(act==="reset"){
    if(confirm("erase your profile and every link from this browser?")){
      S=defaults();editId=null;save();render();toast("all cleared");restartFloat();stopAudio();
    }
  }
  /* gallery actions */
  else if(act==="gal-add"){
    var errEl=document.getElementById("gal-err");
    errEl.textContent="";
    var imgInput=document.getElementById("gal-img");
    var textInput=document.getElementById("gal-text");
    var capInput=document.getElementById("gal-cap");
    var cap=capInput.value.trim().slice(0,120);
    var text=textInput.value.trim().slice(0,500);
    var file=imgInput.files && imgInput.files[0];
    if(file){
      resizeImage(file,function(dataUrl){
        if(!dataUrl){errEl.textContent="that image could not be read.";return;}
        S.gallery.push({id:uid(),type:"image",data:dataUrl,caption:cap||text});
        save();render();toast("image added to extras");
      });
    } else if(text){
      S.gallery.push({id:uid(),type:"text",text:text,caption:cap});
      save();render();toast("message added to extras");
    } else {
      errEl.textContent="choose an image or type a message.";
    }
  }
  else if(act==="gal-del"){
    var gi=parseInt(b.getAttribute("data-i"),10);
    if(gi>=0 && gi<S.gallery.length){S.gallery.splice(gi,1);save();render();toast("removed");}
  }
  else if(act==="gal-up"){
    var gi2=parseInt(b.getAttribute("data-i"),10);
    if(gi2>0){var g=S.gallery[gi2];S.gallery[gi2]=S.gallery[gi2-1];S.gallery[gi2-1]=g;save();render();}
  }
  else if(act==="gal-down"){
    var gi3=parseInt(b.getAttribute("data-i"),10);
    if(gi3>-1 && gi3<S.gallery.length-1){var g2=S.gallery[gi3];S.gallery[gi3]=S.gallery[gi3+1];S.gallery[gi3+1]=g2;save();render();}
  }
  else if(act==="aud-del"){
    var ai=parseInt(b.getAttribute("data-i"),10);
    if(ai>=0 && ai<S.audio.tracks.length){
      S.audio.tracks.splice(ai,1);
      if(!S.audio.tracks.length) S.audio.enabled=false;
      save();render();
      if(S.audio.enabled && S.audio.tracks.length) { currentTrackIndex=0; playTrack(0); }
      else stopAudio();
      toast("track removed");
    }
  }
});

      try{
        var next=sanitize(JSON.parse(fr.result));
        S=next;editId=null;save();render();restartFloat();toast("backup restored");
        syncAudioState();
      }catch(err){toast("that file is not a valid backup");}
    };
    fr.readAsText(t.files[0]);
  }

  if(t.id==="aud-en"){
    S.audio.enabled = t.checked;
    save();
    if(S.audio.enabled && S.audio.tracks.length){
      playTrack(currentTrackIndex>=0?currentTrackIndex:0);
    } else {
      stopAudio();
    }
    render();
  }

  if(t.name==="audmode" && t.type==="radio"){
    S.audio.mode = t.value;
    save();
    if(audioEl){
      audioEl.loop = (S.audio.mode==="loop");
      if(S.audio.mode==="shuffle" && S.audio.enabled && audioEl.paused){
        playTrack(currentTrackIndex>=0?currentTrackIndex:0);
      }
    }
    render();
  }

  if(t.id==="aud-file" && t.files && t.files[0]){
    var f=t.files[0];
    if(!/audio\/mpeg/.test(f.type) && !/\.mp3$/i.test(f.name)){
      toast("please choose an mp3 file");
      return;
    }
    if(f.size > 5*1024*1024){ toast("mp3 too large (max 5 MB)"); return; }
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var dataUrl=reader.result;
        if(!/^data:audio\/mpeg;base64,/.test(dataUrl)){
          toast("unsupported mp3 format"); return;
        }
        S.audio.tracks.push({ id:uid(), name:f.name.replace(/\.mp3$/i,"").slice(0,60), data:dataUrl });
        save();
        if(S.audio.enabled && S.audio.tracks.length===1){
          playTrack(0);
        }
        render();
        toast("mp3 added");
      }catch(err){
        toast("could not read that mp3");
      }
    };
    reader.readAsDataURL(f);
  }
});
app.addEventListener("submit",function(e){
  if(e.target.id!=="lf") return;
  e.preventDefault();
  var name=document.getElementById("lname").value.trim();
  var raw=document.getElementById("lurl").value;
  var emo=firstGlyph(document.getElementById("lemo").value);
  var err=document.getElementById("ferr");
  if(!name){err.textContent="give the button a name.";document.getElementById("lname").focus();return;}
  var href=normalizeUrl(raw);
  if(!href){err.textContent="that url does not look right. use a full address like mysite.com or https://mysite.com/page.";document.getElementById("lurl").focus();return;}
  if(editId){
    var l=S.links.filter(function(x){return x.id===editId;})[0];
    if(l){l.name=name;l.href=href;l.emoji=emo;}
    toast("changes saved");
  }else{
    if(S.links.length>=100){err.textContent="100 links is the limit.";return;}
    S.links.push({id:uid(),name:name,href:href,emoji:emo,clicks:0});
    toast("link added");
  }
  editId=null;save();render();
});

/* helpers */
function slug(){
  return (S.profile.name||"links").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"links";
}
function download(name,text,type){
  var blob=new Blob([text],{type:type+";charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function resizeImage(file,cb){
  if(!/^image\//.test(file.type)){cb(null);return;}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var size=256,c=document.createElement("canvas");
    c.width=c.height=size;
    var ctx=c.getContext("2d"),s=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
    URL.revokeObjectURL(url);
    cb(c.toDataURL("image/jpeg",0.85));
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb(null);};
  img.src=url;
}
function buildStandalone(){
  var pub={
    profile:S.profile,
    links:S.links.map(function(l){return {id:l.id,name:l.name,href:l.href,emoji:l.emoji};}),
    gallery:S.gallery.map(function(g){
      if(g.type==="image") return {id:g.id,type:"image",data:g.data,caption:g.caption||""};
      return {id:g.id,type:"text",text:g.text,caption:g.caption||""};
    }),
    audio:{
      enabled:S.audio.enabled,
      mode:S.audio.mode,
      tracks:S.audio.tracks.map(function(t){return {id:t.id,name:t.name,data:t.data};})
    }
  };
  var clone=document.documentElement.cloneNode(true);
  clone.querySelectorAll("[data-dyn]").forEach(function(n){n.remove();});
  var old=clone.querySelector("#pubdata");if(old)old.remove();
  clone.querySelector("#app").innerHTML="";
  clone.querySelector("title").textContent=S.profile.name||"my links";
  var s=document.createElement("script");
  s.id="pubdata";
  s.textContent="window.PUBLISHED="+JSON.stringify(pub).replace(/</g,"\\u003c")+";";
  clone.querySelector("head").appendChild(s);
  return "<!DOCTYPE html>\n"+clone.outerHTML;
}

/* floating emojis */
var reduce=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var layer=document.createElement("div");
layer.className="float-layer";layer.setAttribute("aria-hidden","true");layer.setAttribute("data-dyn","");
document.body.insertBefore(layer,document.body.firstChild.nextSibling);
var floatTimer=null;
function pickEmoji(){
  var g=glyphs(S.profile.emojis);
  if(!g.length) g=DEFAULT_EMOJI;
  return g[Math.floor(Math.random()*g.length)];
}
function spawn(delay){
  if(layer.children.length>30) return;
  var el=document.createElement("span");
  el.className="fl";
  el.textContent=pickEmoji();
  var dur=9+Math.random()*9;
  el.style.left=(Math.random()*96)+"%";
  el.style.fontSize=(18+Math.random()*26)+"px";
  el.style.setProperty("--dx",((Math.random()-.5)*120)+"px");
  el.style.setProperty("--rot",((Math.random()-.5)*80)+"deg");
  el.style.animationDuration=dur+"s";
  if(delay) el.style.animationDelay="-"+(Math.random()*dur)+"s";
  el.addEventListener("animationend",function(){el.remove();});
  layer.appendChild(el);
}
function restartFloat(){
  if(reduce) return;
  clearInterval(floatTimer);
  layer.innerHTML="";
  for(var i=0;i<12;i++) spawn(true);
  floatTimer=setInterval(function(){if(!document.hidden)spawn(false);},700);
}

/* glitter trail */
var cv=document.createElement("canvas");
cv.className="spark";cv.setAttribute("aria-hidden","true");cv.setAttribute("data-dyn","");
document.body.appendChild(cv);
var cx=cv.getContext("2d"),parts=[],running=false,dpr=Math.min(window.devicePixelRatio||1,2);
var COLS=["#ff2e93","#ffffff","#ffe36b","#7ff3ff","#ff9bd5"];
function fit(){
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
  cx.setTransform(dpr,0,0,dpr,0,0);
}
fit();addEventListener("resize",fit);
function burst(x,y,n){
  if(reduce) return;
  for(var i=0;i<n;i++){
    parts.push({x:x+(Math.random()-.5)*12,y:y+(Math.random()-.5)*12,
      vx:(Math.random()-.5)*2.4,vy:Math.random()*1.4-.4,
      life:1,decay:.014+Math.random()*.02,
      size:4+Math.random()*8,rot:Math.random()*3,
      col:COLS[Math.floor(Math.random()*COLS.length)]});
  }
  if(parts.length>260) parts.splice(0,parts.length-260);
  if(!running){running=true;requestAnimationFrame(tick);}
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=p.decay;p.rot+=.08;
    if(p.life<=0){parts.splice(i,1);continue;}
    cx.save();
    cx.globalAlpha=p.life;cx.fillStyle=p.col;
    cx.translate(p.x,p.y);cx.rotate(p.rot);
    var s=p.size*(.4+.6*p.life);
    cx.beginPath();
    cx.moveTo(0,-s);cx.quadraticCurveTo(0,0,s,0);cx.quadraticCurveTo(0,0,0,s);
    cx.quadraticCurveTo(0,0,-s,0);cx.quadraticCurveTo(0,0,0,-s);
    cx.fill();cx.restore();
  }
  if(parts.length) requestAnimationFrame(tick); else running=false;
}
addEventListener("pointermove",function(e){burst(e.clientX,e.clientY,2);},{passive:true});
addEventListener("pointerdown",function(e){burst(e.clientX,e.clientY,14);},{passive:true});

render();
restartFloat();

/* autoplay attempt (will likely be blocked until first click/tap) */
if(S.audio.enabled && S.audio.tracks.length){
  setTimeout(function(){
    syncAudioState();
  }, 300);
}
})();
</script>
