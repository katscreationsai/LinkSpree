<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hot:#ff2e93;
  --deep:#d1137a;
  --darker:#b80f6a;
  --pink:#ff7ac6;
  --bubble:#ffc2e2;
  --blush:#fff0f8;
  --ink:#6e0c45;
  --aqua:#7ff3ff;
  --gold:#ffe36b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--pink)}
body{
  margin:0;
  min-height:100vh;
  font-family:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  font-weight:500;
  color:var(--ink);
  line-height:1.35;
  overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* background: bubblegum gradient, gingham weave, twinkling glitter */
.bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#ff8ccf 0%,#ffb3dc 45%,#ffd6ec 100%);
}
.bg::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 22px,transparent 22px 44px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 22px,transparent 22px 44px);
}
.bg::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(2.5px 2.5px at 20px 30px,#fff,transparent),
    radial-gradient(2px 2px at 70px 95px,#fff,transparent),
    radial-gradient(2px 2px at 115px 55px,var(--gold),transparent),
    radial-gradient(2.5px 2.5px at 155px 125px,#fff,transparent),
    radial-gradient(2px 2px at 40px 140px,var(--aqua),transparent);
  background-size:180px 170px;
  animation:twinkle 2.6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}

.float-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fl{
  position:absolute;bottom:-60px;
  will-change:transform,opacity;
  animation-name:rise;
  animation-timing-function:linear;
  animation-fill-mode:forwards;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.7));
}
@keyframes rise{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  8%{opacity:.95}
  50%{transform:translate(var(--dx),-58vh) rotate(calc(var(--rot) * .5))}
  90%{opacity:.95}
  100%{transform:translate(calc(var(--dx) * -.6),-118vh) rotate(var(--rot));opacity:0}
}
.spark{position:fixed;inset:0;z-index:50;pointer-events:none}

.wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:22px 14px 110px}

/* the window */
.win{
  background:var(--blush);
  border:4px solid #fff;
  border-radius:20px;
  box-shadow:0 0 0 3px var(--hot),8px 8px 0 3px var(--deep);
  overflow:hidden;
}
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;
  background:linear-gradient(180deg,#ff9bd5 0%,var(--hot) 52%,#e0147f 100%);
  border-bottom:3px solid #fff;
  color:#fff;
}
.bar-title{
  font-family:Pacifico,"Brush Script MT",cursive;
  font-size:19px;
  text-shadow:0 2px 0 var(--darker);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
.dots i:nth-child(1){background:var(--aqua)}
.dots i:nth-child(2){background:var(--gold)}
.dots i:nth-child(3){background:#fff}

.marq{
  overflow:hidden;white-space:nowrap;
  background:#fff;
  border-bottom:3px dotted var(--hot);
  padding:5px 0;
  font-weight:800;font-size:15px;color:var(--deep);
}
.marq-in{display:inline-block;animation:scroll 22s linear infinite}
.marq-in span{padding-right:44px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.body{padding:22px 18px 20px}

.me{text-align:center;margin-bottom:22px}
.av{
  width:116px;height:116px;border-radius:50%;
  margin:0 auto 14px;
  border:5px solid #fff;
  box-shadow:0 0 0 4px var(--hot),6px 6px 0 4px var(--deep);
  overflow:hidden;background:var(--bubble);
  display:flex;align-items:center;justify-content:center;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:62%;height:62%}
.nm{
  margin:0 0 6px;
  font-family:Pacifico,"Brush Script MT",cursive;
  font-weight:400;
  font-size:clamp(28px,9vw,38px);
  line-height:1.2;
  color:var(--hot);
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,4px 4px 0 var(--bubble);
  overflow-wrap:anywhere;
}
.bio{margin:0 auto;max-width:34ch;font-size:17px;font-weight:700;overflow-wrap:anywhere}

/* link buttons */
.links{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.lnk{
  display:flex;align-items:center;gap:12px;
  min-height:58px;padding:8px 18px 8px 10px;
  border-radius:999px;
  border:3px solid #fff;
  background:linear-gradient(180deg,#fff 0%,#ffd7ec 46%,#ffa6d6 54%,var(--pink) 100%);
  box-shadow:0 0 0 2px var(--deep),0 5px 0 2px var(--darker);
  color:var(--ink);
  text-decoration:none;
  font-weight:800;font-size:18px;
  transition:transform .08s,box-shadow .08s;
}
.lnk:hover{transform:translateY(-2px) rotate(-.6deg)}
.lnk:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--deep),0 1px 0 2px var(--darker)}
.lnk:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:4px solid var(--aqua);outline-offset:3px}
.ic{
  flex:none;width:40px;height:40px;border-radius:50%;
  background:#fff;border:2px solid var(--hot);
  display:flex;align-items:center;justify-content:center;
  font-size:21px;color:var(--hot);
}
.lt{flex:1;min-width:0;text-align:center;overflow-wrap:anywhere;padding-right:40px}

.empty{
  text-align:center;padding:18px;border:3px dashed var(--hot);border-radius:16px;
  background:#fff;font-weight:700;
}

/* wall */
.wall{margin-top:34px}
.wt{
  margin:0 0 16px;text-align:center;
  font-family:Pacifico,"Brush Script MT",cursive;font-weight:400;
  font-size:28px;color:var(--hot);
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,3px 3px 0 var(--bubble);
}
.note{
  position:relative;
  margin:0 0 20px;padding:10px 10px 12px;
  background:#fff;
  border:3px solid var(--hot);
  border-radius:10px;
  box-shadow:5px 5px 0 var(--deep);
  transform:rotate(var(--tilt,0deg));
}
.note:last-of-type{margin-bottom:0}
.note img{
  display:block;width:100%;max-height:380px;object-fit:cover;
  border-radius:6px;border:2px solid var(--bubble);margin-bottom:10px;
}
.note p{margin:0;font-weight:700;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.note time{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--deep)}
.nctl{margin-top:10px}

.count{margin:26px 0 0;text-align:center;font-weight:700;font-size:14px}
.digits{display:inline-flex;gap:3px;margin-top:4px}
.dg{
  display:inline-block;min-width:22px;padding:2px 4px;
  background:#2a0518;color:#ff7ac6;border:2px solid #fff;border-radius:4px;
  font-family:"Courier New",monospace;font-weight:700;font-size:20px;
  box-shadow:0 0 0 1px var(--deep);
}

/* editor */
.tabs{display:flex;gap:8px;margin-top:28px}
.tab{
  flex:1;min-height:46px;font:inherit;font-weight:800;font-size:16px;color:var(--ink);
  background:#fff;border:3px solid var(--hot);border-radius:14px 14px 0 0;
  cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--hot);color:#fff;text-shadow:0 1px 0 var(--darker)}
.tabs + .sec{margin-top:0;border-top-left-radius:0;border-top-right-radius:0}
.sec{
  margin-top:20px;padding:16px;
  background:#fff;border:3px solid var(--hot);border-radius:16px;
}
.sec h2{
  margin:0 0 12px;
  font-family:Pacifico,"Brush Script MT",cursive;font-weight:400;
  font-size:22px;color:var(--hot);
}
label.f{display:block;margin:0 0 12px;font-weight:800;font-size:15px}
label.f span{display:block;margin-bottom:4px}
input[type=text],input[type=url],textarea{
  width:100%;font:inherit;font-size:16px;font-weight:500;color:var(--ink);
  padding:10px 12px;background:var(--blush);
  border:3px solid var(--hot);border-radius:12px;
}
textarea{resize:vertical;min-height:84px}
input[type=range]{width:100%;accent-color:var(--hot);height:34px}
input[type=radio],input[type=checkbox]{accent-color:var(--hot);width:22px;height:22px;flex:none}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:800;cursor:pointer}
.fs{margin:0 0 12px;padding:6px 12px;border:3px solid var(--hot);border-radius:12px}
.fs legend{padding:0 6px;font-weight:800;font-size:15px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;padding:6px 18px;
  font:inherit;font-weight:800;font-size:16px;color:var(--ink);
  background:linear-gradient(180deg,#fff,#ffc2e2);
  border:3px solid var(--hot);border-radius:999px;
  box-shadow:0 4px 0 var(--deep);
  cursor:pointer;text-decoration:none;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.main{background:linear-gradient(180deg,#ff9bd5,var(--hot));color:#fff;text-shadow:0 1px 0 var(--darker)}
.btn.danger{border-color:#7a0f2a;color:#7a0f2a;box-shadow:0 4px 0 #7a0f2a}
.btn.sm{min-height:38px;padding:2px 12px;font-size:14px;box-shadow:0 3px 0 var(--deep)}
.btn.sm.danger{box-shadow:0 3px 0 #7a0f2a}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pk{
  width:42px;height:42px;font-size:20px;
  border:2px solid var(--hot);border-radius:50%;background:#fff;cursor:pointer;padding:0;
}
.pk:active{background:var(--bubble)}
.err{color:#a0123a;font-weight:800;margin:0 0 10px;min-height:1.2em}
.hint{font-size:14px;margin:6px 0 0;font-weight:500}
.prev{display:block;max-width:100%;max-height:200px;margin:8px 0 0;border:3px solid var(--hot);border-radius:10px}

.lrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px;border:3px solid var(--hot);border-radius:16px;background:var(--blush);
}
.lrow .meta{flex:1;min-width:140px}
.lrow .meta b{display:block;overflow-wrap:anywhere}
.lrow .meta small{display:block;font-size:13px;overflow-wrap:anywhere;opacity:.85}
.lctl{display:flex;gap:6px;flex-wrap:wrap}
.tlist{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:10px}

.toggle{
  position:fixed;z-index:60;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
}
.mute{
  position:fixed;z-index:60;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
}
.mute[hidden]{display:none}
.toast{
  position:fixed;z-index:70;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;border:3px solid #fff;border-radius:999px;
  padding:8px 18px;font-weight:800;max-width:90vw;text-align:center;
  transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .bg::after,.marq-in{animation:none}
  .fl{display:none}
  .lnk,.btn{transition:none}
}
@media (min-width:640px){
  .wrap{padding-top:44px}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="wrap"><div id="app"></div></main>

<script>
(function(){
"use strict";

var PUB = window.PUBLISHED || null;
var KEY = "pinklinks.v2";
var OLDKEY = "pinklinks.v1";
var DEFAULT_EMOJI = ["💖","🌸","✨","🎀","💕","🦋","⭐","🍓"];
var QUICK = ["💖","🌸","🎀","✨","🦋","🍓","🎧","📸","🛍️","🎮","💌","🌈"];
var EXT = {"image/jpeg":"jpg","image/png":"png","image/gif":"gif","image/webp":"webp","audio/mpeg":"mp3"};
var TYPE = {jpg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",mp3:"audio/mpeg"};
var MAX_MP3 = 60*1024*1024;

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function seg(s){
  if(window.Intl && Intl.Segmenter){
    return Array.from(new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(s),function(x){return x.segment;});
  }
  return Array.from(s);
}
function firstGlyph(s){
  s=(s||"").trim();
  return s ? (seg(s)[0]||"") : "";
}
function glyphs(s){return seg((s||"").replace(/[\s,]+/g,""));}
function normalizeUrl(raw){
  var u=(raw||"").trim();
  if(!u) return null;
  if(/\s/.test(u)) return null;
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(u)) u="https://"+u;
  var parsed;
  try{ parsed=new URL(u); }catch(e){ return null; }
  var ok=["http:","https:","mailto:","tel:"];
  if(ok.indexOf(parsed.protocol)===-1) return null;
  if((parsed.protocol==="http:"||parsed.protocol==="https:") && parsed.hostname.indexOf(".")===-1 && parsed.hostname!=="localhost") return null;
  return parsed.href;
}
function fmtSize(n){
  if(n>=1048576) return (n/1048576).toFixed(1)+" MB";
  return Math.max(1,Math.round(n/1024))+" KB";
}

/* state */
function defaults(){
  return {
    profile:{
      name:"Kat's Creations AI",
      bio:"welcome to my corner of the internet, tap a link and say hi",
      marquee:"welcome to my page ✦ thanks for stopping by ✦ tap a link, any link",
      avatar:"",
      emojis:DEFAULT_EMOJI.join(" ")
    },
    links:[],
    wall:[],
    tracks:[],
    audio:{mode:"loop",volume:0.6,showMute:true},
    taps:0
  };
}
var SRC_RE=/^media\/[A-Za-z0-9._\-]+$/;
function sanitize(raw){
  var out=defaults();
  if(!raw || typeof raw!=="object") return out;
  var p=raw.profile||{};
  ["name","bio","marquee","emojis"].forEach(function(k){
    if(typeof p[k]==="string") out.profile[k]=p[k].slice(0,k==="bio"?240:120);
  });
  if(typeof p.avatar==="string" && /^data:image\/(jpeg|png|webp);base64,/.test(p.avatar) && p.avatar.length<400000) out.profile.avatar=p.avatar;

  out.links=[];
  (Array.isArray(raw.links)?raw.links:[]).slice(0,100).forEach(function(l){
    if(!l||typeof l.name!=="string") return;
    var href=normalizeUrl(l.href||l.url);
    var name=l.name.trim().slice(0,60);
    if(!href||!name) return;
    out.links.push({
      id:(typeof l.id==="string"&&l.id)?l.id.slice(0,30):uid(),
      name:name,href:href,
      emoji:firstGlyph(typeof l.emoji==="string"?l.emoji:""),
      clicks:Math.max(0,parseInt(l.clicks,10)||0)
    });
  });

  out.wall=[];
  (Array.isArray(raw.wall)?raw.wall:[]).slice(0,200).forEach(function(w){
    if(!w||typeof w!=="object") return;
    var text=typeof w.text==="string"?w.text.slice(0,500):"";
    var img=typeof w.img==="string"?w.img.slice(0,40):"";
    var src=(typeof w.src==="string"&&SRC_RE.test(w.src))?w.src:"";
    if(!text.trim() && !img && !src) return;
    var d=(typeof w.date==="string"&&!isNaN(new Date(w.date)))?w.date:"";
    out.wall.push({id:(typeof w.id==="string"&&w.id)?w.id.slice(0,40):uid(),text:text,img:img,src:src,date:d});
  });

  out.tracks=[];
  (Array.isArray(raw.tracks)?raw.tracks:[]).slice(0,60).forEach(function(t){
    if(!t||typeof t.id!=="string"||!t.id) return;
    out.tracks.push({
      id:t.id.slice(0,40),
      name:typeof t.name==="string"?t.name.slice(0,120):"track",
      src:(typeof t.src==="string"&&SRC_RE.test(t.src))?t.src:""
    });
  });

  var a=raw.audio||{};
  out.audio.mode=a.mode==="shuffle"?"shuffle":"loop";
  var v=parseFloat(a.volume);
  out.audio.volume=isNaN(v)?0.6:Math.min(1,Math.max(0,v));
  out.audio.showMute=a.showMute!==false;
  out.taps=Math.max(0,parseInt(raw.taps,10)||0);
  return out;
}
function load(){
  if(PUB) return sanitize(PUB);
  try{
    var raw=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY);
    if(raw) return sanitize(JSON.parse(raw));
  }catch(e){}
  return defaults();
}
var S=load();
function save(){
  if(PUB) return;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("could not save, your browser storage is full or blocked"); }
}

var app=document.getElementById("app");
var editing=false;
var tab="page";
var editId=null;
var wallDraft="",pendingImg=null,wallEditId=null,removeImg=false;

/* toast */
var toastEl=document.createElement("div");
toastEl.className="toast";toastEl.setAttribute("role","status");toastEl.setAttribute("data-dyn","");
document.body.appendChild(toastEl);
var toastT;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("on");},2600);
}

/* media storage: IndexedDB holds the image and mp3 files */
var urls={},mediaOk=false,dbp=null;
function openDB(){
  if(dbp) return dbp;
  dbp=new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error("no indexedDB"));return;}
    var r=indexedDB.open("pinklinks-media",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("media",{keyPath:"id"});};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
  return dbp;
}
function tx(mode,fn){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction("media",mode),req=fn(t.objectStore("media"));
      t.oncomplete=function(){res(req&&req.result);};
      t.onerror=function(){rej(t.error);};
      t.onabort=function(){rej(t.error);};
    });
  });
}
function putMedia(id,kind,blob,name){
  return tx("readwrite",function(s){return s.put({id:id,kind:kind,blob:blob,type:blob.type,name:name||""});}).then(function(){
    if(urls[id]) URL.revokeObjectURL(urls[id]);
    urls[id]=URL.createObjectURL(blob);
  });
}
function getMedia(id){return tx("readonly",function(s){return s.get(id);});}
function delMedia(id){
  if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id];}
  return tx("readwrite",function(s){return s.delete(id);}).catch(function(){});
}
function clearMedia(){
  Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k]);});
  urls={};
  return tx("readwrite",function(s){return s.clear();});
}
function loadMediaUrls(){
  return openDB().then(function(){return tx("readonly",function(s){return s.getAll();});}).then(function(items){
    Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k]);});
    urls={};
    items.forEach(function(r){urls[r.id]=URL.createObjectURL(r.blob);});
  });
}
function prune(){
  var ch=false;
  S.wall.forEach(function(w){if(w.img && !urls[w.img]){w.img="";ch=true;}});
  var before=S.wall.length;
  S.wall=S.wall.filter(function(w){return w.text.trim()||w.img;});
  if(S.wall.length!==before) ch=true;
  var tb=S.tracks.length;
  S.tracks=S.tracks.filter(function(t){return urls[t.id];});
  if(S.tracks.length!==tb) ch=true;
  if(ch) save();
}
function mediaSrc(w){return PUB ? w.src : (urls[w.img]||"");}
function trackSrc(t){return PUB ? t.src : (urls[t.id]||"");}

/* image processing: photos are shrunk, gifs kept so they still move */
function processImage(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)){rej(new Error("that file is not an image"));return;}
    if(file.type==="image/gif"){
      if(file.size>3*1024*1024){rej(new Error("gifs must be under 3 MB so they can stay animated"));return;}
      res({blob:file,type:"image/gif",name:file.name});return;
    }
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=900,sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      var ctx=c.getContext("2d");
      var type=file.type==="image/png"?"image/png":"image/jpeg";
      if(type==="image/jpeg"){ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);}
      ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(!b){rej(new Error("that image could not be processed"));return;}
        res({blob:b,type:type,name:file.name});
      },type,0.86);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("that image could not be read"));};
    img.src=url;
  });
}
function resizeAvatar(file,cb){
  if(!/^image\//.test(file.type)){cb(null);return;}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var size=256,c=document.createElement("canvas");
    c.width=c.height=size;
    var ctx=c.getContext("2d"),s=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
    URL.revokeObjectURL(url);
    cb(c.toDataURL("image/jpeg",0.85));
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb(null);};
  img.src=url;
}

function buildOrder(avoid){
  order=S.tracks.map(function(_,i){return i;});
  if(S.audio.mode==="shuffle"){
    for(var i=order.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1)),t=order[i];order[i]=order[j];order[j]=t;
    }
    if(order.length>1 && order[0]===avoid){var k=order.indexOf(avoid);var s=order[0];order[0]=order[1];order[1]=s;}
  }
  pos=0;
}
function setSrc(){
  var idx=order[pos];lastIdx=idx;
  audio.src=trackSrc(S.tracks[idx]);
  audio.loop=S.tracks.length===1;
}
function tryPlay(){
  if(muted||!S.tracks.length) return;
  var pr=audio.play();
  if(pr && pr.catch) pr.catch(function(){armGesture();});
}
function armGesture(){
  if(armed) return;
  armed=true;
  var evs=["pointerup","click","touchend","keydown"];
  function go(){
    evs.forEach(function(n){document.removeEventListener(n,go,true);});
    armed=false;
    tryPlay();
  }
  evs.forEach(function(n){document.addEventListener(n,go,true);});
}
function loadPlaylist(){
  audio.pause();
  errCount=0;
  if(!S.tracks.length){audio.removeAttribute("src");audio.load();updateMute();return;}
  buildOrder(-1);
  setSrc();
  audio.volume=S.audio.volume;
  updateMute();
  tryPlay();
}
audio.addEventListener("ended",function(){
  if(!S.tracks.length) return;
  pos++;
  if(pos>=order.length) buildOrder(lastIdx);
  setSrc();
  tryPlay();
});
audio.addEventListener("playing",function(){errCount=0;});
audio.addEventListener("error",function(){
  errCount++;
  if(S.tracks.length>1 && errCount<=S.tracks.length){
    pos++;
    if(pos>=order.length) buildOrder(lastIdx);
    setSrc();tryPlay();
  }
});
muteBtn.addEventListener("click",function(){
  muted=!muted;
  try{localStorage.setItem("pinklinks.mute",muted?"1":"0");}catch(e){}
  if(muted) audio.pause(); else tryPlay();
  updateMute();
});

/* zip helpers: stored zip files, no compression, so mp3 and image data stay as is */
var CRC=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}t[n]=c>>>0;}
  return t;
})();
function crc32(u8){
  var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) c=(c>>>8)^CRC[(c^u8[i])&255];
  return (c^0xFFFFFFFF)>>>0;
}
async function makeZip(files){
  var enc=new TextEncoder(),chunks=[],central=[],offset=0,d=new Date();
  var dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  var dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    var data=f.data||new Uint8Array(await f.blob.arrayBuffer());
    var name=enc.encode(f.name),crc=crc32(data);
    var lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);
    v.setUint16(10,dt,true);v.setUint16(12,dd,true);v.setUint32(14,crc,true);
    v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);
    v.setUint16(26,name.length,true);v.setUint16(28,0,true);lh.set(name,30);
    chunks.push(lh,data);
    var ch=new Uint8Array(46+name.length),w=new DataView(ch.buffer);
    w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);
    w.setUint16(10,0,true);w.setUint16(12,dt,true);w.setUint16(14,dd,true);w.setUint32(16,crc,true);
    w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);
    w.setUint16(30,0,true);w.setUint16(32,0,true);w.setUint16(34,0,true);w.setUint16(36,0,true);
    w.setUint32(38,0,true);w.setUint32(42,offset,true);ch.set(name,46);
    central.push(ch);
    offset+=lh.length+data.length;
  }
  var cdSize=central.reduce(function(a,c){return a+c.length;},0);
  var end=new Uint8Array(22),e=new DataView(end.buffer);
  e.setUint32(0,0x06054b50,true);e.setUint16(4,0,true);e.setUint16(6,0,true);
  e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true);e.setUint32(16,offset,true);e.setUint16(20,0,true);
  return new Blob(chunks.concat(central,[end]),{type:"application/zip"});
}
function readZip(buf){
  var u8=new Uint8Array(buf),v=new DataView(buf),off=0,out={},dec=new TextDecoder();
  while(off+30<=u8.length && v.getUint32(off,true)===0x04034b50){
    var flags=v.getUint16(off+6,true),method=v.getUint16(off+8,true);
    var size=v.getUint32(off+18,true),nlen=v.getUint16(off+26,true),xlen=v.getUint16(off+28,true);
    if(method!==0||(flags&8)) throw new Error("this zip was not made by this page");
    var name=dec.decode(u8.subarray(off+30,off+30+nlen));
    var start=off+30+nlen+xlen;
    out[name]=u8.slice(start,start+size);
    off=start+size;
  }
  return out;
}

async function buildSite(){
  var files=[],n=0,m=0,wall=[],tracks=[];
  for(var i=0;i<S.wall.length;i++){
    var w=S.wall[i],item={id:w.id,text:w.text,img:"",src:"",date:w.date};
    if(w.img){
      var rec=await getMedia(w.img);
      if(rec){
        var path="media/note-"+(++n)+"."+(EXT[rec.type]||"jpg");
        files.push({name:path,blob:rec.blob});item.src=path;
      }
    }
    if(item.text.trim()||item.src) wall.push(item);
  }
  for(var j=0;j<S.tracks.length;j++){
    var t=S.tracks[j],r2=await getMedia(t.id);
    if(r2){
      var p2="media/track-"+(++m)+".mp3";
      files.push({name:p2,blob:r2.blob});
      tracks.push({id:t.id,name:"",src:p2});
    }
  }
  var pub={
    profile:S.profile,
    links:S.links.map(function(l){return {id:l.id,name:l.name,href:l.href,emoji:l.emoji};}),
    wall:wall,tracks:tracks,audio:S.audio
  };
  var enc=new TextEncoder();

  return makeZip(files);
}
async function buildBackup(){
  var files=[],enc=new TextEncoder(),ids=[];
  S.wall.forEach(function(w){if(w.img) ids.push(w.img);});
  S.tracks.forEach(function(t){ids.push(t.id);});
  for(var i=0;i<ids.length;i++){
    var rec=await getMedia(ids[i]);
    if(rec) files.push({name:"media/"+ids[i]+"."+(EXT[rec.type]||"bin"),blob:rec.blob});
  }
  files.unshift({name:"data.json",data:enc.encode(JSON.stringify(S))});
  return makeZip(files);
}
async function restoreBackup(file){
  var buf=await file.arrayBuffer();
  var head=new Uint8Array(buf,0,Math.min(4,buf.byteLength));
  var next;
  if(head[0]===0x50 && head[1]===0x4B){
    var z=readZip(buf);
    if(!z["data.json"]) throw new Error("data.json is missing from that zip");
    next=sanitize(JSON.parse(new TextDecoder().decode(z["data.json"])));
    await clearMedia();
    var refs=[];
    next.wall.forEach(function(w){if(w.img) refs.push(w.img);});
    next.tracks.forEach(function(t){refs.push(t.id);});
    for(var i=0;i<refs.length;i++){
      var id=refs[i];
      var key=Object.keys(z).filter(function(k){return k.indexOf("media/"+id+".")===0;})[0];
      if(!key) continue;
      var ext=key.split(".").pop().toLowerCase();
      var type=TYPE[ext]||"application/octet-stream";
      await putMedia(id,type.indexOf("audio")===0?"audio":"img",new Blob([z[key]],{type:type}),"");
    }
  }else{
    next=sanitize(JSON.parse(new TextDecoder().decode(buf)));
  }
  next.taps=next.taps||0;
  S=next;editId=null;wallEditId=null;wallDraft="";pendingImg=null;removeImg=false;
  prune();save();
}

/* events */
function moveItem(arr,id,dir){
  var i=arr.findIndex(function(x){return x.id===id;}),j=i+dir;
  if(i<0||j<0||j>=arr.length) return false;
  var t=arr[i];arr[i]=arr[j];arr[j]=t;return true;
}
function clearPending(){
  if(pendingImg){URL.revokeObjectURL(pendingImg.url);}
  pendingImg=null;
}
app.addEventListener("click",function(e){
  var a=e.target.closest("a.lnk");
  if(a && !PUB){
    var l=S.links.filter(function(x){return x.id===a.getAttribute("data-id");})[0];
    if(l){l.clicks++;S.taps++;save();}
    return;
  }
  var b=e.target.closest("[data-act]");
  if(!b) return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  var i=S.links.findIndex(function(x){return x.id===id;});

  if(act==="toggle"){editing=!editing;editId=null;wallEditId=null;clearPending();render();window.scrollTo(0,0);}
  else if(act==="tab"){tab=b.getAttribute("data-tab");render();}
  else if(act==="up" && i>0){moveItem(S.links,id,-1);save();render();}
  else if(act==="down" && i>-1){moveItem(S.links,id,1);save();render();}
  else if(act==="edit"){editId=id;render();document.getElementById("lf").scrollIntoView({behavior:"smooth",block:"center"});}
  else if(act==="cancel"){editId=null;render();}
  else if(act==="del"){
    if(i>-1 && confirm('delete "'+S.links[i].name+'"?')){S.links.splice(i,1);if(editId===id)editId=null;save();render();toast("link deleted");}
  }
  else if(act==="pick"){document.getElementById("lemo").value=b.getAttribute("data-e");}
  else if(act==="rmav"){S.profile.avatar="";save();render();}

  else if(act==="wup"){moveItem(S.wall,id,-1);save();render();}
  else if(act==="wdown"){moveItem(S.wall,id,1);save();render();}
  else if(act==="wedit"){
    var w=S.wall.filter(function(x){return x.id===id;})[0];
    if(w){wallEditId=id;wallDraft=w.text;clearPending();removeImg=false;render();document.getElementById("wf").scrollIntoView({behavior:"smooth",block:"center"});}
  }
  else if(act==="wcancel"){wallEditId=null;wallDraft="";clearPending();removeImg=false;render();}
  else if(act==="wrmimg"){
    if(pendingImg) clearPending(); else removeImg=true;
    render();
  }
  else if(act==="wdel"){
    var wi=S.wall.findIndex(function(x){return x.id===id;});
    if(wi>-1 && confirm("delete this note?")){
      var rm=S.wall.splice(wi,1)[0];
      if(rm.img) delMedia(rm.img);
      if(wallEditId===id){wallEditId=null;wallDraft="";clearPending();}
      save();render();toast("note deleted");
    }
  }

  else if(act==="tup"){moveItem(S.tracks,id,-1);save();render();loadPlaylist();}
  else if(act==="tdown"){moveItem(S.tracks,id,1);save();render();loadPlaylist();}
  else if(act==="tdel"){
    var ti=S.tracks.findIndex(function(x){return x.id===id;});
    if(ti>-1 && confirm('delete "'+S.tracks[ti].name+'"?')){
      S.tracks.splice(ti,1);delMedia(id);save();render();loadPlaylist();toast("track deleted");
    }
  }

  else if(act==="export"){
    toast("building backup");
    buildBackup().then(function(blob){downloadBlob(slug()+"-backup.zip",blob);toast("backup downloaded");})
      .catch(function(){toast("backup failed, try again");});
  }
  else if(act==="publish"){
    toast("building your site");
    buildSite().then(function(blob){downloadBlob(slug()+"-site.zip",blob);toast("site downloaded");})
      .catch(function(){toast("could not build the site, try again");});
  }
  else if(act==="reset"){
    if(confirm("erase your profile, links, notes, photos, and music from this browser?")){
      var wipe=mediaOk?clearMedia():Promise.resolve();
      wipe.catch(function(){}).then(function(){
        S=defaults();editId=null;wallEditId=null;wallDraft="";clearPending();removeImg=false;
        save();render();restartFloat();loadPlaylist();toast("all cleared");
      });
    }
  }
});

app.addEventListener("input",function(e){
  var t=e.target,p=S.profile;
  if(t.id==="pname"){
    p.name=t.value;save();
    document.getElementById("bt").textContent="~ "+p.name+" ~";
    document.getElementById("nm").textContent=p.name;
    document.title=p.name||"my links";
  }else if(t.id==="pbio"){
    p.bio=t.value;save();document.getElementById("bio").textContent=p.bio;
  }else if(t.id==="pmarq"){
    p.marquee=t.value;save();
  }else if(t.id==="pemo"){
    p.emojis=t.value;save();restartFloat();
  }else if(t.id==="wtext"){
    wallDraft=t.value;
  }else if(t.id==="avol"){
    S.audio.volume=Math.min(1,Math.max(0,parseInt(t.value,10)/100));
    audio.volume=S.audio.volume;save();
  }
});

app.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="pmarq"){render();}
  else if(t.id==="pav" && t.files && t.files[0]){
    resizeAvatar(t.files[0],function(url){
      if(!url){toast("that file could not be read as an image");return;}
      S.profile.avatar=url;save();render();toast("photo updated");
    });
  }
  else if(t.id==="wimg" && t.files && t.files[0]){
    if(!mediaOk){toast("this browser is blocking media storage, so images cannot be saved here");t.value="";return;}
    processImage(t.files[0]).then(function(r){
      clearPending();
      pendingImg={blob:r.blob,type:r.type,name:r.name,url:URL.createObjectURL(r.blob)};
      render();
    }).catch(function(err){toast(err.message);});
  }
  else if(t.id==="amp3" && t.files && t.files.length){
    if(!mediaOk){toast("this browser is blocking media storage, so music cannot be saved here");t.value="";return;}
    var list=Array.prototype.slice.call(t.files),added=0,skipped=0;
    (async function(){
      for(var i=0;i<list.length;i++){
        var f=list[i];
        var isMp3=/\.mp3$/i.test(f.name)||f.type==="audio/mpeg";
        if(!isMp3||f.size>MAX_MP3||S.tracks.length>=60){skipped++;continue;}
        var id=uid();
        try{
          await putMedia(id,"audio",new Blob([f],{type:"audio/mpeg"}),f.name);
          S.tracks.push({id:id,name:f.name.replace(/\.mp3$/i,"").slice(0,120),src:""});
          added++;
        }catch(err){skipped++;}
      }
      save();render();loadPlaylist();
      toast(added+" added"+(skipped?(", "+skipped+" skipped (mp3 only, 60 MB max each)"):""));
    })();
  }
  else if(t.name==="amode"){
    S.audio.mode=t.value==="shuffle"?"shuffle":"loop";save();loadPlaylist();
  }
  else if(t.id==="ashow"){
    S.audio.showMute=t.checked;save();updateMute();
  }
  else if(t.id==="imp" && t.files && t.files[0]){
    var file=t.files[0];
    toast("restoring");
    restoreBackup(file).then(function(){
      render();restartFloat();loadPlaylist();toast("backup restored");
    }).catch(function(err){toast("restore failed: "+err.message);});
  }
});

app.addEventListener("submit",function(e){
  if(e.target.id==="lf"){
    e.preventDefault();
    var name=document.getElementById("lname").value.trim();
    var raw=document.getElementById("lurl").value;
    var emo=firstGlyph(document.getElementById("lemo").value);
    var err=document.getElementById("ferr");
    if(!name){err.textContent="give the button a name.";document.getElementById("lname").focus();return;}
    var href=normalizeUrl(raw);
    if(!href){err.textContent="that url does not look right. use a full address like mysite.com or https://mysite.com/page.";document.getElementById("lurl").focus();return;}
    if(editId){
      var l=S.links.filter(function(x){return x.id===editId;})[0];
      if(l){l.name=name;l.href=href;l.emoji=emo;}
      toast("changes saved");
    }else{
      if(S.links.length>=100){err.textContent="100 links is the limit.";return;}
      S.links.push({id:uid(),name:name,href:href,emoji:emo,clicks:0});
      toast("link added");
    }
    editId=null;save();render();
  }
  else if(e.target.id==="wf"){
    e.preventDefault();
    var werr=document.getElementById("werr");
    var text=wallDraft.trim();
    var cur=wallEditId?S.wall.filter(function(x){return x.id===wallEditId;})[0]:null;
    var hasImg=!!pendingImg||!!(cur&&cur.img&&!removeImg);
    if(!text && !hasImg){werr.textContent="write a message or add an image first.";return;}
    (async function(){
      try{
        if(cur){
          if(pendingImg){
            if(cur.img) await delMedia(cur.img);
            var nid=uid();await putMedia(nid,"img",pendingImg.blob,pendingImg.name);cur.img=nid;
          }else if(removeImg && cur.img){
            await delMedia(cur.img);cur.img="";
          }
          cur.text=text;
          toast("note saved");
        }else{
          var imgId="";
          if(pendingImg){imgId=uid();await putMedia(imgId,"img",pendingImg.blob,pendingImg.name);}
          S.wall.unshift({id:uid(),text:text,img:imgId,src:"",date:new Date().toISOString()});
          toast("note posted");
        }
        clearPending();wallDraft="";wallEditId=null;removeImg=false;
        save();render();
      }catch(err){werr.textContent="could not save that image. your browser storage may be full.";}
    })();
  }
});

/* floating emojis */
var reduce=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var layer=document.createElement("div");
layer.className="float-layer";layer.setAttribute("aria-hidden","true");layer.setAttribute("data-dyn","");
document.body.insertBefore(layer,document.body.firstChild.nextSibling);
var floatTimer=null;
function pickEmoji(){
  var g=glyphs(S.profile.emojis);
  if(!g.length) g=DEFAULT_EMOJI;
  return g[Math.floor(Math.random()*g.length)];
}
function spawn(delay){
  if(layer.children.length>30) return;
  var el=document.createElement("span");
  el.className="fl";
  el.textContent=pickEmoji();
  var dur=9+Math.random()*9;
  el.style.left=(Math.random()*96)+"%";
  el.style.fontSize=(18+Math.random()*26)+"px";
  el.style.setProperty("--dx",((Math.random()-.5)*120)+"px");
  el.style.setProperty("--rot",((Math.random()-.5)*80)+"deg");
  el.style.animationDuration=dur+"s";
  if(delay) el.style.animationDelay="-"+(Math.random()*dur)+"s";
  el.addEventListener("animationend",function(){el.remove();});
  layer.appendChild(el);
}
function restartFloat(){
  if(reduce) return;
  clearInterval(floatTimer);
  layer.innerHTML="";
  for(var i=0;i<12;i++) spawn(true);
  floatTimer=setInterval(function(){if(!document.hidden)spawn(false);},700);
}

/* glitter trail */
var cv=document.createElement("canvas");
cv.className="spark";cv.setAttribute("aria-hidden","true");cv.setAttribute("data-dyn","");
document.body.appendChild(cv);
var cx=cv.getContext("2d"),parts=[],running=false,dpr=Math.min(window.devicePixelRatio||1,2);
var COLS=["#ff2e93","#ffffff","#ffe36b","#7ff3ff","#ff9bd5"];
function fit(){
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
  cx.setTransform(dpr,0,0,dpr,0,0);
}
fit();addEventListener("resize",fit);
function burst(x,y,n){
  if(reduce) return;
  for(var i=0;i<n;i++){
    parts.push({x:x+(Math.random()-.5)*12,y:y+(Math.random()-.5)*12,
      vx:(Math.random()-.5)*2.4,vy:Math.random()*1.4-.4,
      life:1,decay:.014+Math.random()*.02,
      size:4+Math.random()*8,rot:Math.random()*3,
      col:COLS[Math.floor(Math.random()*COLS.length)]});
  }
  if(parts.length>260) parts.splice(0,parts.length-260);
  if(!running){running=true;requestAnimationFrame(tick);}
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=p.decay;p.rot+=.08;
    if(p.life<=0){parts.splice(i,1);continue;}
    cx.save();
    cx.globalAlpha=p.life;cx.fillStyle=p.col;
    cx.translate(p.x,p.y);cx.rotate(p.rot);
    var s=p.size*(.4+.6*p.life);
    cx.beginPath();
    cx.moveTo(0,-s);cx.quadraticCurveTo(0,0,s,0);cx.quadraticCurveTo(0,0,0,s);
    cx.quadraticCurveTo(0,0,-s,0);cx.quadraticCurveTo(0,0,0,-s);
    cx.fill();cx.restore();
  }
  if(parts.length) requestAnimationFrame(tick); else running=false;
}
addEventListener("pointermove",function(e){burst(e.clientX,e.clientY,2);},{passive:true});
addEventListener("pointerdown",function(e){burst(e.clientX,e.clientY,14);},{passive:true});

/* start */
function start(){
  render();
  restartFloat();
  loadPlaylist();
}
if(PUB){
  start();
}else{
  loadMediaUrls().then(function(){mediaOk=true;}).catch(function(){mediaOk=false;}).then(function(){
    if(mediaOk) prune();
    start();
  });
}
})();
</script>
