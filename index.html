<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hot:#ff2e93;
  --deep:#d1137a;
  --darker:#b80f6a;
  --pink:#ff7ac6;
  --bubble:#ffc2e2;
  --blush:#fff0f8;
  --ink:#6e0c45;
  --aqua:#7ff3ff;
  --gold:#ffe36b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--pink)}
body{
  margin:0;
  min-height:100vh;
  font-family:"Baloo 2","Trebuchet MS",Verdana,sans-serif;
  font-weight:500;
  color:var(--ink);
  line-height:1.35;
  overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* background: bubblegum gradient, gingham weave, twinkling glitter */
.bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#ff8ccf 0%,#ffb3dc 45%,#ffd6ec 100%);
}
.bg::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 22px,transparent 22px 44px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 22px,transparent 22px 44px);
}
.bg::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(2.5px 2.5px at 20px 30px,#fff,transparent),
    radial-gradient(2px 2px at 70px 95px,#fff,transparent),
    radial-gradient(2px 2px at 115px 55px,var(--gold),transparent),
    radial-gradient(2.5px 2.5px at 155px 125px,#fff,transparent),
    radial-gradient(2px 2px at 40px 140px,var(--aqua),transparent);
  background-size:180px 170px;
  animation:twinkle 2.6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}

.float-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fl{
  position:absolute;bottom:-60px;
  will-change:transform,opacity;
  animation-name:rise;
  animation-timing-function:linear;
  animation-fill-mode:forwards;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.7));
}
@keyframes rise{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  8%{opacity:.95}
  50%{transform:translate(var(--dx),-58vh) rotate(calc(var(--rot) * .5))}
  90%{opacity:.95}
  100%{transform:translate(calc(var(--dx) * -.6),-118vh) rotate(var(--rot));opacity:0}
}
.spark{position:fixed;inset:0;z-index:50;pointer-events:none}

.wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:22px 14px 110px}

/* the window */
.win{
  background:var(--blush);
  border:4px solid #fff;
  border-radius:20px;
  box-shadow:0 0 0 3px var(--hot),8px 8px 0 3px var(--deep);
  overflow:hidden;
}
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;
  background:linear-gradient(180deg,#ff9bd5 0%,var(--hot) 52%,#e0147f 100%);
  border-bottom:3px solid #fff;
  color:#fff;
}
.bar-title{
  font-family:Pacifico,"Brush Script MT",cursive;
  font-size:19px;
  text-shadow:0 2px 0 var(--darker);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
.dots i:nth-child(1){background:var(--aqua)}
.dots i:nth-child(2){background:var(--gold)}
.dots i:nth-child(3){background:#fff}

.marq{
  overflow:hidden;white-space:nowrap;
  background:#fff;
  border-bottom:3px dotted var(--hot);
  padding:5px 0;
  font-weight:800;font-size:15px;color:var(--deep);
}
.marq-in{display:inline-block;animation:scroll 22s linear infinite}
.marq-in span{padding-right:44px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.body{padding:22px 18px 20px}

.me{text-align:center;margin-bottom:22px}
.av{
  width:116px;height:116px;border-radius:50%;
  margin:0 auto 14px;
  border:5px solid #fff;
  box-shadow:0 0 0 4px var(--hot),6px 6px 0 4px var(--deep);
  overflow:hidden;background:var(--bubble);
  display:flex;align-items:center;justify-content:center;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{width:62%;height:62%}
.nm{
  margin:0 0 6px;
  font-family:Pacifico,"Brush Script MT",cursive;
  font-weight:400;
  font-size:clamp(28px,9vw,38px);
  line-height:1.2;
  color:var(--hot);
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,4px 4px 0 var(--bubble);
  overflow-wrap:anywhere;
}
.bio{margin:0 auto;max-width:34ch;font-size:17px;font-weight:700;overflow-wrap:anywhere}

/* link buttons */
.links{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.lnk{
  display:flex;align-items:center;gap:12px;
  min-height:58px;padding:8px 18px 8px 10px;
  border-radius:999px;
  border:3px solid #fff;
  background:linear-gradient(180deg,#fff 0%,#ffd7ec 46%,#ffa6d6 54%,var(--pink) 100%);
  box-shadow:0 0 0 2px var(--deep),0 5px 0 2px var(--darker);
  color:var(--ink);
  text-decoration:none;
  font-weight:800;font-size:18px;
  transition:transform .08s,box-shadow .08s;
}
.lnk:hover{transform:translateY(-2px) rotate(-.6deg)}
.lnk:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--deep),0 1px 0 2px var(--darker)}
.lnk:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:4px solid var(--aqua);outline-offset:3px}
.ic{
  flex:none;width:40px;height:40px;border-radius:50%;
  background:#fff;border:2px solid var(--hot);
  display:flex;align-items:center;justify-content:center;
  font-size:21px;color:var(--hot);
}
.lt{flex:1;min-width:0;text-align:center;overflow-wrap:anywhere;padding-right:40px}

.empty{
  text-align:center;padding:18px;border:3px dashed var(--hot);border-radius:16px;
  background:#fff;font-weight:700;
}

/* wall */
.wall{margin-top:34px}
.wt{
  margin:0 0 16px;text-align:center;
  font-family:Pacifico,"Brush Script MT",cursive;font-weight:400;
  font-size:28px;color:var(--hot);
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,3px 3px 0 var(--bubble);
}
.note{
  position:relative;
  margin:0 0 20px;padding:10px 10px 12px;
  background:#fff;
  border:3px solid var(--hot);
  border-radius:10px;
  box-shadow:5px 5px 0 var(--deep);
  transform:rotate(var(--tilt,0deg));
}
.note:last-of-type{margin-bottom:0}
.note img{
  display:block;width:100%;max-height:380px;object-fit:cover;
  border-radius:6px;border:2px solid var(--bubble);margin-bottom:10px;
}
.note p{margin:0;font-weight:700;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.note time{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--deep)}
.nctl{margin-top:10px}

.count{margin:26px 0 0;text-align:center;font-weight:700;font-size:14px}
.digits{display:inline-flex;gap:3px;margin-top:4px}
.dg{
  display:inline-block;min-width:22px;padding:2px 4px;
  background:#2a0518;color:#ff7ac6;border:2px solid #fff;border-radius:4px;
  font-family:"Courier New",monospace;font-weight:700;font-size:20px;
  box-shadow:0 0 0 1px var(--deep);
}

/* editor */
.tabs{display:flex;gap:8px;margin-top:28px}
.tab{
  flex:1;min-height:46px;font:inherit;font-weight:800;font-size:16px;color:var(--ink);
  background:#fff;border:3px solid var(--hot);border-radius:14px 14px 0 0;
  cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--hot);color:#fff;text-shadow:0 1px 0 var(--darker)}
.tabs + .sec{margin-top:0;border-top-left-radius:0;border-top-right-radius:0}
.sec{
  margin-top:20px;padding:16px;
  background:#fff;border:3px solid var(--hot);border-radius:16px;
}
.sec h2{
  margin:0 0 12px;
  font-family:Pacifico,"Brush Script MT",cursive;font-weight:400;
  font-size:22px;color:var(--hot);
}
label.f{display:block;margin:0 0 12px;font-weight:800;font-size:15px}
label.f span{display:block;margin-bottom:4px}
input[type=text],input[type=url],textarea{
  width:100%;font:inherit;font-size:16px;font-weight:500;color:var(--ink);
  padding:10px 12px;background:var(--blush);
  border:3px solid var(--hot);border-radius:12px;
}
textarea{resize:vertical;min-height:84px}
input[type=range]{width:100%;accent-color:var(--hot);height:34px}
input[type=radio],input[type=checkbox]{accent-color:var(--hot);width:22px;height:22px;flex:none}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:800;cursor:pointer}
.fs{margin:0 0 12px;padding:6px 12px;border:3px solid var(--hot);border-radius:12px}
.fs legend{padding:0 6px;font-weight:800;font-size:15px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;padding:6px 18px;
  font:inherit;font-weight:800;font-size:16px;color:var(--ink);
  background:linear-gradient(180deg,#fff,#ffc2e2);
  border:3px solid var(--hot);border-radius:999px;
  box-shadow:0 4px 0 var(--deep);
  cursor:pointer;text-decoration:none;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.main{background:linear-gradient(180deg,#ff9bd5,var(--hot));color:#fff;text-shadow:0 1px 0 var(--darker)}
.btn.danger{border-color:#7a0f2a;color:#7a0f2a;box-shadow:0 4px 0 #7a0f2a}
.btn.sm{min-height:38px;padding:2px 12px;font-size:14px;box-shadow:0 3px 0 var(--deep)}
.btn.sm.danger{box-shadow:0 3px 0 #7a0f2a}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pk{
  width:42px;height:42px;font-size:20px;
  border:2px solid var(--hot);border-radius:50%;background:#fff;cursor:pointer;padding:0;
}
.pk:active{background:var(--bubble)}
.err{color:#a0123a;font-weight:800;margin:0 0 10px;min-height:1.2em}
.hint{font-size:14px;margin:6px 0 0;font-weight:500}
.prev{display:block;max-width:100%;max-height:200px;margin:8px 0 0;border:3px solid var(--hot);border-radius:10px}

.lrow{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px;border:3px solid var(--hot);border-radius:16px;background:var(--blush);
}
.lrow .meta{flex:1;min-width:140px}
.lrow .meta b{display:block;overflow-wrap:anywhere}
.lrow .meta small{display:block;font-size:13px;overflow-wrap:anywhere;opacity:.85}
.lctl{display:flex;gap:6px;flex-wrap:wrap}
.tlist{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:10px}

.toggle{
  position:fixed;z-index:60;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
}
.mute{
  position:fixed;z-index:60;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
}
.mute[hidden]{display:none}
.toast{
  position:fixed;z-index:70;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;border:3px solid #fff;border-radius:999px;
  padding:8px 18px;font-weight:800;max-width:90vw;text-align:center;
  transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .bg::after,.marq-in{animation:none}
  .fl{display:none}
  .lnk,.btn{transition:none}
}
@media (min-width:640px){
  .wrap{padding-top:44px}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="wrap"><div id="app"></div></main>

<script>
(function(){
"use strict";

var PUB = window.PUBLISHED || null;
var KEY = "pinklinks.v2";
var OLDKEY = "pinklinks.v1";
var DEFAULT_EMOJI = ["💖","🌸","✨","🎀","💕","🦋","⭐","🍓"];
var QUICK = ["💖","🌸","🎀","✨","🦋","🍓","🎧","📸","🛍️","🎮","💌","🌈"];
var EXT = {"image/jpeg":"jpg","image/png":"png","image/gif":"gif","image/webp":"webp","audio/mpeg":"mp3"};
var TYPE = {jpg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",mp3:"audio/mpeg"};
var MAX_MP3 = 60*1024*1024;

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function seg(s){
  if(window.Intl && Intl.Segmenter){
    return Array.from(new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(s),function(x){return x.segment;});
  }
  return Array.from(s);
}
function firstGlyph(s){
  s=(s||"").trim();
  return s ? (seg(s)[0]||"") : "";
}
function glyphs(s){return seg((s||"").replace(/[\s,]+/g,""));}
function normalizeUrl(raw){
  var u=(raw||"").trim();
  if(!u) return null;
  if(/\s/.test(u)) return null;
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(u)) u="https://"+u;
  var parsed;
  try{ parsed=new URL(u); }catch(e){ return null; }
  var ok=["http:","https:","mailto:","tel:"];
  if(ok.indexOf(parsed.protocol)===-1) return null;
  if((parsed.protocol==="http:"||parsed.protocol==="https:") && parsed.hostname.indexOf(".")===-1 && parsed.hostname!=="localhost") return null;
  return parsed.href;
}
function fmtSize(n){
  if(n>=1048576) return (n/1048576).toFixed(1)+" MB";
  return Math.max(1,Math.round(n/1024))+" KB";
}

/* state */
function defaults(){
  return {
    profile:{
      name:"Kat's Creations AI",
      bio:"welcome to my corner of the internet, tap a link and say hi",
      marquee:"welcome to my page ✦ thanks for stopping by ✦ tap a link, any link",
      avatar:"",
      emojis:DEFAULT_EMOJI.join(" ")
    },
    links:[],
    wall:[],
    tracks:[],
    audio:{mode:"loop",volume:0.6,showMute:true},
    taps:0
  };
}
var SRC_RE=/^media\/[A-Za-z0-9._\-]+$/;
function sanitize(raw){
  var out=defaults();
  if(!raw || typeof raw!=="object") return out;
  var p=raw.profile||{};
  ["name","bio","marquee","emojis"].forEach(function(k){
    if(typeof p[k]==="string") out.profile[k]=p[k].slice(0,k==="bio"?240:120);
  });
  if(typeof p.avatar==="string" && /^data:image\/(jpeg|png|webp);base64,/.test(p.avatar) && p.avatar.length<400000) out.profile.avatar=p.avatar;

  out.links=[];
  (Array.isArray(raw.links)?raw.links:[]).slice(0,100).forEach(function(l){
    if(!l||typeof l.name!=="string") return;
    var href=normalizeUrl(l.href||l.url);
    var name=l.name.trim().slice(0,60);
    if(!href||!name) return;
    out.links.push({
      id:(typeof l.id==="string"&&l.id)?l.id.slice(0,30):uid(),
      name:name,href:href,
      emoji:firstGlyph(typeof l.emoji==="string"?l.emoji:""),
      clicks:Math.max(0,parseInt(l.clicks,10)||0)
    });
  });

  out.wall=[];
  (Array.isArray(raw.wall)?raw.wall:[]).slice(0,200).forEach(function(w){
    if(!w||typeof w!=="object") return;
    var text=typeof w.text==="string"?w.text.slice(0,500):"";
    var img=typeof w.img==="string"?w.img.slice(0,40):"";
    var src=(typeof w.src==="string"&&SRC_RE.test(w.src))?w.src:"";
    if(!text.trim() && !img && !src) return;
    var d=(typeof w.date==="string"&&!isNaN(new Date(w.date)))?w.date:"";
    out.wall.push({id:(typeof w.id==="string"&&w.id)?w.id.slice(0,40):uid(),text:text,img:img,src:src,date:d});
  });

  out.tracks=[];
  (Array.isArray(raw.tracks)?raw.tracks:[]).slice(0,60).forEach(function(t){
    if(!t||typeof t.id!=="string"||!t.id) return;
    out.tracks.push({
      id:t.id.slice(0,40),
      name:typeof t.name==="string"?t.name.slice(0,120):"track",
      src:(typeof t.src==="string"&&SRC_RE.test(t.src))?t.src:""
    });
  });

  var a=raw.audio||{};
  out.audio.mode=a.mode==="shuffle"?"shuffle":"loop";
  var v=parseFloat(a.volume);
  out.audio.volume=isNaN(v)?0.6:Math.min(1,Math.max(0,v));
  out.audio.showMute=a.showMute!==false;
  out.taps=Math.max(0,parseInt(raw.taps,10)||0);
  return out;
}
function load(){
  if(PUB) return sanitize(PUB);
  try{
    var raw=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY);
    if(raw) return sanitize(JSON.parse(raw));
  }catch(e){}
  return defaults();
}
var S=load();
function save(){
  if(PUB) return;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("could not save, your browser storage is full or blocked"); }
}

var app=document.getElementById("app");
var editing=false;
var tab="page";
var editId=null;
var wallDraft="",pendingImg=null,wallEditId=null,removeImg=false;

/* toast */
var toastEl=document.createElement("div");
toastEl.className="toast";toastEl.setAttribute("role","status");toastEl.setAttribute("data-dyn","");
document.body.appendChild(toastEl);
var toastT;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove("on");},2600);
}

/* media storage: IndexedDB holds the image and mp3 files */
var urls={},mediaOk=false,dbp=null;
function openDB(){
  if(dbp) return dbp;
  dbp=new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error("no indexedDB"));return;}
    var r=indexedDB.open("pinklinks-media",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("media",{keyPath:"id"});};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
  return dbp;
}
function tx(mode,fn){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var t=db.transaction("media",mode),req=fn(t.objectStore("media"));
      t.oncomplete=function(){res(req&&req.result);};
      t.onerror=function(){rej(t.error);};
      t.onabort=function(){rej(t.error);};
    });
  });
}
function putMedia(id,kind,blob,name){
  return tx("readwrite",function(s){return s.put({id:id,kind:kind,blob:blob,type:blob.type,name:name||""});}).then(function(){
    if(urls[id]) URL.revokeObjectURL(urls[id]);
    urls[id]=URL.createObjectURL(blob);
  });
}
function getMedia(id){return tx("readonly",function(s){return s.get(id);});}
function delMedia(id){
  if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id];}
  return tx("readwrite",function(s){return s.delete(id);}).catch(function(){});
}
function clearMedia(){
  Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k]);});
  urls={};
  return tx("readwrite",function(s){return s.clear();});
}
function loadMediaUrls(){
  return openDB().then(function(){return tx("readonly",function(s){return s.getAll();});}).then(function(items){
    Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k]);});
    urls={};
    items.forEach(function(r){urls[r.id]=URL.createObjectURL(r.blob);});
  });
}
function prune(){
  var ch=false;
  S.wall.forEach(function(w){if(w.img && !urls[w.img]){w.img="";ch=true;}});
  var before=S.wall.length;
  S.wall=S.wall.filter(function(w){return w.text.trim()||w.img;});
  if(S.wall.length!==before) ch=true;
  var tb=S.tracks.length;
  S.tracks=S.tracks.filter(function(t){return urls[t.id];});
  if(S.tracks.length!==tb) ch=true;
  if(ch) save();
}
function mediaSrc(w){return PUB ? w.src : (urls[w.img]||"");}
function trackSrc(t){return PUB ? t.src : (urls[t.id]||"");}

/* image processing: photos are shrunk, gifs kept so they still move */
function processImage(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)){rej(new Error("that file is not an image"));return;}
    if(file.type==="image/gif"){
      if(file.size>3*1024*1024){rej(new Error("gifs must be under 3 MB so they can stay animated"));return;}
